<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="ThermoPlan v5 아키텍처">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5668"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fde"/>
    </marker>
    <style>
      text { font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #142033; }
      .zt { font-size: 15px; font-weight: 700; fill: #4a5668; letter-spacing: -0.01em; }
      .t { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
      .tl { font-size: 17px; font-weight: 700; letter-spacing: -0.015em; }
      .d { font-size: 12.5px; fill: #4a5668; }
      .m { font-size: 13.5px; font-weight: 700; }
      .l { font-size: 12px; fill: #4a5668; font-weight: 600; }
      .lb { font-size: 12px; fill: #2f6fde; font-weight: 700; }
      .card { fill: #ffffff; stroke: #e5e9f0; stroke-width: 1.2; }
      .ln { fill: none; stroke: #4a5668; stroke-width: 1.6; }
      .lnB { fill: none; stroke: #2f6fde; stroke-width: 1.8; }
      .dot { fill: none; stroke: #8a94a3; stroke-width: 1.4; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="20" y="34" style="font-size:22px;font-weight:800;letter-spacing:-0.02em">ThermoPlan 아키텍처 (v5)</text>
  <text x="20" y="58" class="d" style="font-size:13.5px">서버 없이 관리형 서비스로 운영합니다. 수치는 결정적 엔진(열모델 시뮬레이터)이 내고, 생성형 AI는 해석·협의·설명을 맡습니다.</text>

  <!-- ===================== zone: users ===================== -->
  <rect x="20" y="76" width="222" height="420" rx="18" fill="#f7f9fc" stroke="#e5e9f0"/>
  <text x="36" y="104" class="zt">사용자</text>
  <rect x="36" y="120" width="190" height="150" rx="12" class="card"/>
  <rect x="52" y="138" width="34" height="24" rx="4" fill="none" stroke="#2f6fde" stroke-width="2"/>
  <path d="M62 168 h14" stroke="#2f6fde" stroke-width="2"/>
  <text x="96" y="156" class="t">시설 담당자</text>
  <text x="52" y="194" class="d">운영 화면 · 건물 설정</text>
  <text x="52" y="214" class="d">시뮬레이션 랩(/lab)</text>
  <text x="52" y="234" class="d">로그인(목업) 후 사용</text>
  <text x="52" y="254" class="d">PC · 발표용 프로젝터</text>

  <rect x="36" y="292" width="190" height="186" rx="12" class="card"/>
  <rect x="54" y="308" width="20" height="34" rx="4" fill="none" stroke="#e8894f" stroke-width="2"/>
  <circle cx="64" cy="336" r="1.8" fill="#e8894f"/>
  <text x="96" y="330" class="t">건물 이용자</text>
  <text x="52" y="366" class="d">강의실 QR → /feedback</text>
  <text x="52" y="386" class="d">"춥다·덥다·답답해요"</text>
  <text x="52" y="406" class="d">로그인 없음</text>
  <text x="52" y="426" class="d">같은 강의실 30분에 1회</text>
  <text x="52" y="456" class="l">모바일 브라우저</text>

  <!-- ===================== zone: AWS ===================== -->
  <rect x="268" y="76" width="934" height="806" rx="20" fill="#f5f8fd" stroke="#cfdcf3"/>
  <text x="290" y="104" class="zt">AWS 클라우드 · ap-northeast-2 · CloudFormation 스택 하나</text>

  <!-- CloudFront -->
  <rect x="290" y="120" width="204" height="122" rx="12" class="card"/>
  <text x="306" y="146" class="t">Amazon CloudFront</text>
  <text x="306" y="172" class="d">HTTPS 주소 하나</text>
  <text x="306" y="192" class="d">/* → 웹, /api/* → API</text>
  <text x="306" y="212" class="d">API에는 비밀 헤더를 붙임</text>
  <text x="306" y="230" class="l">SPA 경로는 index.html</text>

  <!-- S3 web -->
  <rect x="290" y="288" width="204" height="110" rx="12" class="card"/>
  <text x="306" y="314" class="t">Amazon S3 (웹)</text>
  <text x="306" y="340" class="d">React 정적 파일</text>
  <text x="306" y="360" class="d">overview.html</text>
  <text x="306" y="380" class="d">OAC로만 읽기</text>

  <!-- Bedrock -->
  <rect x="290" y="436" width="204" height="210" rx="12" fill="#f6f5fe" stroke="#d9d3f7" stroke-width="1.2"/>
  <text x="306" y="462" class="t">Amazon Bedrock</text>
  <text x="306" y="490" class="m" style="fill:#4a3aa7">Claude Sonnet 5.5</text>
  <text x="306" y="510" class="d">시간표 이미지·PDF 추출</text>
  <text x="306" y="528" class="d">운영 코파일럿(도구 호출)</text>
  <text x="306" y="558" class="m" style="fill:#4a3aa7">Claude Haiku 5.5</text>
  <text x="306" y="578" class="d">자연어 일정 · 공지 이미지</text>
  <text x="306" y="596" class="d">건물 설명 해석</text>
  <text x="306" y="614" class="d">두 에이전트 협의(4턴)</text>
  <text x="306" y="634" class="l">JSON 스키마 구조화 출력</text>

  <!-- EventBridge -->
  <rect x="290" y="676" width="204" height="190" rx="12" class="card"/>
  <text x="306" y="702" class="t">EventBridge Scheduler</text>
  <text x="306" y="728" class="d">매시 20분 → Lambda</text>
  <text x="306" y="750" class="d">① 날씨 갱신·예보 저장</text>
  <text x="306" y="770" class="d">② 바뀐 날짜만 재계산</text>
  <text x="306" y="790" class="d">③ 3차(오늘)·2차(이번 주)</text>
  <text x="322" y="808" class="d">재검증</text>
  <text x="306" y="840" class="l">자동 운전이면 조정안 적용</text>

  <!-- Lambda -->
  <rect x="530" y="120" width="650" height="420" rx="14" fill="#ffffff" stroke="#2f6fde" stroke-width="1.8"/>
  <text x="550" y="150" class="tl">AWS Lambda · Function URL</text>
  <text x="550" y="172" class="d">FastAPI + Mangum · Python 3.13 arm64 · 비밀 헤더가 없으면 거절</text>

  <g>
    <rect x="550" y="190" width="300" height="96" rx="10" fill="#f3fbf7" stroke="#cbead9"/>
    <rect x="550" y="190" width="5" height="96" rx="2" fill="#14a673"/>
    <text x="568" y="216" class="m">hvac/ 결정적 엔진</text>
    <text x="568" y="240" class="d">2R2C 열모델 · VRF 부분부하 · PMV</text>
    <text x="568" y="260" class="d">4개 운전 전략 · 1분 간격 시뮬레이션</text>
    <text x="568" y="278" class="l">모든 kWh·요금·쾌적 수치의 출처</text>
  </g>
  <g>
    <rect x="862" y="190" width="300" height="96" rx="10" fill="#f2f7fe" stroke="#cfe0f8"/>
    <rect x="862" y="190" width="5" height="96" rx="2" fill="#2a78d6"/>
    <text x="880" y="216" class="m">planning · 1·2·3차 스케줄</text>
    <text x="880" y="240" class="d">월간 계획 → 주간 조정 → 일일 검증</text>
    <text x="880" y="260" class="d">정합성 점검 · 조정안 · 운전 모드</text>
    <text x="880" y="278" class="l">쾌적 의견 · CO₂·일사 계산</text>
  </g>
  <g>
    <rect x="550" y="300" width="300" height="96" rx="10" fill="#f6f5fe" stroke="#ddd7f8"/>
    <rect x="550" y="300" width="5" height="96" rx="2" fill="#6250d6"/>
    <text x="568" y="326" class="m">agents · 두 에이전트 협의</text>
    <text x="568" y="350" class="d">북항이(비용) ⇄ 사용자 에이전트(쾌적)</text>
    <text x="568" y="370" class="d">제안마다 시뮬레이터 검증</text>
    <text x="568" y="388" class="l">결정적 판정 · 규칙 기반 대체</text>
  </g>
  <g>
    <rect x="862" y="300" width="300" height="96" rx="10" fill="#f2f6fd" stroke="#d4e1f7"/>
    <rect x="862" y="300" width="5" height="96" rx="2" fill="#2f6fde"/>
    <text x="880" y="326" class="m">onboarding · 건물 설정</text>
    <text x="880" y="350" class="d">건물 설명 해석 · 게이트웨이 연결</text>
    <text x="880" y="370" class="d">데이터 수집 · 부족한 정보 질문</text>
    <text x="880" y="388" class="l">답은 정책·운영 규칙에 바로 반영</text>
  </g>
  <g>
    <rect x="550" y="410" width="300" height="110" rx="10" fill="#fbfaff" stroke="#e5e1fb"/>
    <rect x="550" y="410" width="5" height="110" rx="2" fill="#6250d6"/>
    <text x="568" y="436" class="m">lab · 시뮬레이션 랩</text>
    <text x="568" y="460" class="d">에이전트 운전을 날마다 재시뮬레이션</text>
    <text x="568" y="480" class="d">현재 운영·규칙·AI와 비교 (격리 실행)</text>
    <text x="568" y="500" class="d">실측 CSV → NMBE·CV(RMSE)</text>
  </g>
  <g>
    <rect x="862" y="410" width="300" height="110" rx="10" fill="#f7f8fa" stroke="#e5e9f0"/>
    <rect x="862" y="410" width="5" height="110" rx="2" fill="#565a60"/>
    <text x="880" y="436" class="m">jobs · 비동기 작업</text>
    <text x="880" y="460" class="d">협의 · 랩 · 시간표 이미지 추출</text>
    <text x="880" y="480" class="d">Lambda가 자기 자신을 비동기 호출</text>
    <text x="880" y="500" class="d">작업 상태는 DynamoDB, 화면은 폴링</text>
  </g>

  <!-- self-invoke loop -->
  <path d="M1112 120 C1112 84 1168 84 1168 116" class="lnB" marker-end="url(#arrB)"/>
  <text x="1018" y="96" class="lb">비동기 자기 호출</text>

  <!-- DynamoDB / S3 data -->
  <rect x="530" y="584" width="316" height="124" rx="12" class="card"/>
  <text x="546" y="610" class="t">Amazon DynamoDB</text>
  <text x="546" y="636" class="d">강의 · 이벤트 · 운영 규칙 · 정책</text>
  <text x="546" y="656" class="d">조정안 · 쾌적 의견 · 제어 명령</text>
  <text x="546" y="676" class="d">작업 상태 · 변경 기록 · 운전 모드</text>
  <text x="546" y="696" class="l">사용자·외부 입력</text>

  <rect x="864" y="584" width="316" height="124" rx="12" class="card"/>
  <text x="880" y="610" class="t">Amazon S3 (데이터)</text>
  <text x="880" y="636" class="d">날짜별 계산 결과(입력 지문으로 캐시)</text>
  <text x="880" y="656" class="d">날씨 캐시 · 예보 스냅숏</text>
  <text x="880" y="676" class="d">협의 기록 · 랩 결과 · 실측 CSV</text>
  <text x="880" y="696" class="l">계산 결과·큰 데이터</text>

  <!-- SSM / IAM -->
  <rect x="530" y="742" width="316" height="124" rx="12" class="card"/>
  <text x="546" y="768" class="t">SSM Parameter Store</text>
  <text x="546" y="794" class="d">기상청 인증키 (SecureString)</text>
  <text x="546" y="814" class="d">운영자 키 (데모 초기화)</text>
  <text x="546" y="834" class="d">CloudFront 비밀 헤더 값</text>
  <text x="546" y="856" class="l">Lambda가 시작할 때 읽음</text>

  <rect x="864" y="742" width="316" height="124" rx="12" class="card"/>
  <text x="880" y="768" class="t">IAM 실행 역할 2개</text>
  <text x="880" y="794" class="d">API: 이 프로젝트의 테이블·버킷·</text>
  <text x="880" y="814" class="d">파라미터와 Bedrock 호출만 허용</text>
  <text x="880" y="834" class="d">스케줄러: Lambda 호출만 허용</text>

  <!-- ===================== zone: external data ===================== -->
  <rect x="1240" y="76" width="340" height="250" rx="18" fill="#f7f9fc" stroke="#e5e9f0"/>
  <text x="1256" y="104" class="zt">외부 데이터</text>
  <rect x="1256" y="118" width="308" height="88" rx="12" class="card"/>
  <text x="1272" y="144" class="t">기상청 API (공공데이터포털)</text>
  <text x="1272" y="168" class="d">단기예보 · 초단기실황</text>
  <text x="1272" y="188" class="d">예보는 하루 전 스냅숏으로 저장</text>
  <rect x="1256" y="220" width="308" height="88" rx="12" class="card"/>
  <text x="1272" y="246" class="t">Open-Meteo</text>
  <text x="1272" y="270" class="d">시간별 실측 · 전날 예보 · 평년 기후</text>
  <text x="1272" y="290" class="d">기온 · 습도 · 일사</text>

  <!-- ===================== zone: building site ===================== -->
  <rect x="1240" y="352" width="340" height="530" rx="18" fill="#fbfbfa" stroke="#565a60" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="1256" y="380" class="zt">건물 현장 (폐쇄망)</text>
  <text x="1256" y="400" class="l" style="fill:#8a5a00">데모에서는 열모델 시뮬레이터가 응답</text>

  <rect x="1256" y="416" width="308" height="112" rx="12" class="card" style="stroke:#cfdcf3"/>
  <text x="1272" y="442" class="t">현장 게이트웨이 (Docker)</text>
  <text x="1272" y="466" class="d">클라우드로는 아웃바운드 TLS만</text>
  <text x="1272" y="486" class="d">연결 코드로 짝짓기</text>
  <text x="1272" y="506" class="d">포인트 탐색 · 강의실 자동 매핑</text>

  <rect x="1256" y="574" width="308" height="112" rx="12" class="card"/>
  <text x="1272" y="600" class="t">중앙제어 PC (시스템 에어컨)</text>
  <text x="1272" y="624" class="d">BACnet/IP 47808 · Modbus TCP 502</text>
  <text x="1272" y="644" class="d">제조사 API(HTTPS) · OPC UA 4840</text>
  <text x="1272" y="664" class="d">현재: 22℃ 고정, 운전 시간 고정</text>

  <rect x="1256" y="732" width="308" height="132" rx="12" class="card"/>
  <text x="1272" y="758" class="t">설비와 센서</text>
  <text x="1272" y="782" class="d">실내기 19대 · 실외기 3대</text>
  <text x="1272" y="802" class="d">IT관 3·4층 강의실 10실</text>
  <text x="1272" y="822" class="d">실내온도 · CO₂ · 재실(Wi-Fi)</text>
  <text x="1272" y="846" class="l">CO₂·재실은 데모에서 시뮬레이션</text>

  <!-- ===================== arrows ===================== -->
  <!-- users -> CloudFront -->
  <path d="M226 176 H288" class="ln" marker-end="url(#arr)"/>
  <text x="236" y="168" class="l">HTTPS</text>
  <path d="M226 384 H256 V214 H288" class="ln" marker-end="url(#arr)"/>
  <!-- CloudFront -> S3 web -->
  <path d="M392 242 V284" class="ln" marker-end="url(#arr)"/>
  <text x="400" y="268" class="l">/* 정적 파일</text>
  <!-- CloudFront -> Lambda -->
  <path d="M494 160 H527" class="lnB" marker-end="url(#arrB)"/>
  <text x="511" y="151" class="lb" text-anchor="middle">/api/*</text>
  <!-- Lambda -> Bedrock -->
  <path d="M530 474 H498" class="ln" marker-end="url(#arr)"/>
  <!-- EventBridge -> Lambda -->
  <path d="M494 770 H514 V514 H527" class="lnB" marker-end="url(#arrB)"/>
  <!-- Lambda <-> DynamoDB / S3 data -->
  <path d="M688 540 V580" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="696" y="565" class="l">읽기·쓰기</text>
  <path d="M1022 540 V580" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="1030" y="565" class="l">읽기·쓰기</text>
  <!-- Lambda -> weather -->
  <path d="M1180 162 H1252" class="ln" marker-end="url(#arr)"/>
  <text x="1186" y="152" class="l">날씨 수집</text>
  <!-- gateway <-> Lambda -->
  <path d="M1256 472 H1221 V300 H1184" class="lnB" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
  <text transform="translate(1236 388) rotate(-90)" class="lb" text-anchor="middle">상태 수집 · 제어 명령</text>
  <!-- gateway <-> PC <-> equipment -->
  <path d="M1410 530 V570" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="1419" y="555" class="l">포인트 읽기·쓰기</text>
  <path d="M1410 688 V728" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="1419" y="713" class="l">설정온도·운전 명령 / 상태</text>
</svg>
