AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  HVAC Schedule AI (ThermoPlan) - CloudFront + S3 web, DynamoDB + S3 data.
  ApiMode=lambda runs the FastAPI backend on Lambda (execution roles are created by an
  account admin with infra/admin-setup.sh); ApiMode=external routes /api/* to an external origin.

Parameters:
  ApiMode:
    Type: String
    AllowedValues: [external, lambda]
    Default: external
  ExternalApiDomain:
    Type: String
    Default: example.com
    Description: Host name of the external API origin (ApiMode=external)
  FunctionRoleArn:
    Type: String
    Default: ""
  SchedulerRoleArn:
    Type: String
    Default: ""
  CodeBucket:
    Type: String
    Default: ""
  CodeKey:
    Type: String
    Default: ""
  OriginSecret:
    Type: String
    NoEcho: true
  OperatorKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Header value that unlocks /api/admin/reset (empty disables it)
  KmaKeyParam:
    Type: String
    Default: /hvac-ai/kma-key
  FunctionName:
    Type: String
    Default: hvac-ai-api

Conditions:
  UseLambda: !Equals [!Ref ApiMode, lambda]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub hvac-ai-data-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: [{ Key: project, Value: hvac-ai }]

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub hvac-ai-web-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: [{ Key: project, Value: hvac-ai }]

  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: hvac-ai-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      Tags: [{ Key: project, Value: hvac-ai }]

  # ---------------------------------------------------------------- Lambda mode only
  ApiFunction:
    Type: AWS::Lambda::Function
    Condition: UseLambda
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: python3.13
      Architectures: [arm64]
      Handler: app.handler.handler
      MemorySize: 2048
      Timeout: 600
      Role: !Ref FunctionRoleArn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          TABLE_NAME: !Ref Table
          ORIGIN_SECRET: !Ref OriginSecret
          OPERATOR_KEY: !Ref OperatorKey
          KMA_KEY_PARAM: !Ref KmaKeyParam
          BEDROCK_REGION: !Ref AWS::Region
          MODEL_SONNET: global.anthropic.claude-sonnet-5-5
          MODEL_HAIKU: global.anthropic.claude-haiku-5-5
          LLM_DAILY_CAP: "600"
      Tags: [{ Key: project, Value: hvac-ai }]

  ApiAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Condition: UseLambda
    Properties:
      FunctionName: !Ref ApiFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 900

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Condition: UseLambda
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: NONE

  ApiFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: UseLambda
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ApiFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseLambda
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  HourlySchedule:
    Type: AWS::Scheduler::Schedule
    Condition: UseLambda
    Properties:
      Name: hvac-ai-hourly
      Description: Fetch KMA/Open-Meteo weather, keep forecast snapshots, recompute changed days
      ScheduleExpression: cron(20 * * * ? *)
      ScheduleExpressionTimezone: Asia/Seoul
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt ApiFunction.Arn
        RoleArn: !Ref SchedulerRoleArn
        Input: '{"task":"hourly"}'

  # ---------------------------------------------------------------- web
  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: hvac-ai-web-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: hvac-ai-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for client-side routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          if (!req.uri.includes('.')) { req.uri = '/index.html'; }
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: hvac-ai
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt WebOAC.Id
          - Id: api
            DomainName: !If
              - UseLambda
              - !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
              - !Ref ExternalApiDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
            OriginCustomHeaders:
              - HeaderName: x-origin-secret
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
      Tags: [{ Key: project, Value: hvac-ai }]

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  WebBucketName:
    Value: !Ref WebBucket
  DataBucketName:
    Value: !Ref DataBucket
  TableName:
    Value: !Ref Table
